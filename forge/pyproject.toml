[project]
name = "forge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nick Stricker", email = "strickerdev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10,<4",
    "claude-agent-sdk>=0.2.178",
    "fastapi>=0.162.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
forge = "forge:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
